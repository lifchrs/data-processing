<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hand Correction Comparison</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; height: 100vh; }

  #header {
    display: flex; align-items: center; gap: 16px; padding: 8px 16px;
    background: #16213e; border-bottom: 1px solid #0f3460; height: 48px;
  }
  #header h1 { font-size: 16px; font-weight: 600; white-space: nowrap; color: #e94560; }
  #video-select {
    padding: 4px 8px; background: #0f3460; color: #e0e0e0; border: 1px solid #533483;
    border-radius: 4px; font-size: 13px; max-width: 500px;
  }
  #action-label { font-size: 13px; color: #a0a0c0; font-style: italic; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #loading-indicator {
    display: none; padding: 2px 10px; background: #e94560; border-radius: 10px;
    font-size: 12px; animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

  #main { display: flex; height: calc(100vh - 48px - 56px); }

  .panel { flex: 1; position: relative; background: #0a0a1a; }
  .panel + .panel { border-left: 2px solid #0f3460; }
  .panel-label {
    position: absolute; top: 8px; left: 8px; z-index: 10;
    padding: 4px 12px; border-radius: 4px; font-size: 13px; font-weight: 600;
    pointer-events: none;
  }
  #left-panel .panel-label { background: rgba(50,50,255,0.85); color: #fff; }
  #right-panel .panel-label { background: rgba(0,200,0,0.85); color: #fff; }
  .panel canvas { width: 100%; height: 100%; display: block; }

  .help-hint {
    position: absolute; bottom: 8px; right: 8px; z-index: 10;
    background: rgba(15,52,96,0.7); padding: 4px 8px; border-radius: 4px; font-size: 11px; color: #888;
  }

  #controls {
    display: flex; align-items: center; gap: 12px; padding: 8px 16px;
    background: #16213e; border-top: 1px solid #0f3460; height: 56px;
  }
  #play-btn {
    width: 36px; height: 36px; background: #e94560; border: none; border-radius: 50%;
    color: white; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  #play-btn:hover { background: #ff6b81; }
  #time-slider { flex: 1; height: 6px; -webkit-appearance: none; background: #0f3460; border-radius: 3px; outline: none; }
  #time-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: #e94560; border-radius: 50%; cursor: pointer; }
  #time-slider::-moz-range-thumb { width: 18px; height: 18px; background: #e94560; border-radius: 50%; cursor: pointer; border: none; }
  #frame-label { font-size: 13px; min-width: 90px; text-align: center; font-variant-numeric: tabular-nums; }
  #point-size-group { display: flex; align-items: center; gap: 6px; }
  #point-size-group label { font-size: 12px; color: #a0a0c0; }
  #point-size-slider { width: 80px; }
  #follow-cam-group { display: flex; align-items: center; gap: 4px; }
  #follow-cam-group label { font-size: 12px; color: #a0a0c0; cursor: pointer; user-select: none; }
  #follow-cam-cb { cursor: pointer; }
</style>
</head>
<body>

<div id="header">
  <h1>Hand Comparison</h1>
  <select id="video-select"></select>
  <span id="action-label"></span>
  <span id="loading-indicator">Loading...</span>
</div>

<div id="main">
  <div id="left-panel" class="panel">
    <div class="panel-label">Original VITRA (blue)</div>
    <canvas id="canvas-left"></canvas>
  </div>
  <div id="right-panel" class="panel">
    <div class="panel-label">Corrected (green)</div>
    <canvas id="canvas-right"></canvas>
    <div class="help-hint">Drag: rotate | Scroll: zoom | Right-drag: pan</div>
  </div>
</div>

<div id="controls">
  <button id="play-btn">&#9654;</button>
  <input type="range" id="time-slider" min="0" max="0" value="0" step="1">
  <span id="frame-label">0 / 0</span>
  <div id="point-size-group">
    <label>Point size</label>
    <input type="range" id="point-size-slider" min="0.5" max="8" value="2" step="0.5">
  </div>
  <div id="follow-cam-group">
    <input type="checkbox" id="follow-cam-cb" checked>
    <label for="follow-cam-cb">Follow camera</label>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { TrackballControls } from 'three/addons/controls/TrackballControls.js';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

// ── State ──
let manifest = {};
let currentVideo = null;
let currentFrameIdx = 0;
let playing = false;
let playInterval = null;
let pointSize = 2;
let followCamera = true;
let sceneRadius = 1;
let syncing = false;  // prevent infinite sync loop

const plyCache = new Map();
const plyLoader = new PLYLoader();

// ── Two renderers ──
function createPanel(canvasId) {
  const canvas = document.getElementById(canvasId);
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setClearColor(0x0a0a1a);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, 1, 0.01, 1000);
  camera.position.set(0, 0, 3);

  const controls = new TrackballControls(camera, canvas);
  controls.rotateSpeed = 3.0;
  controls.zoomSpeed = 1.5;
  controls.panSpeed = 1.0;
  controls.dynamicDampingFactor = 0.15;
  controls.staticMoving = false;

  return { canvas, renderer, scene, camera, controls, pointCloud: null };
}

const panelL = createPanel('canvas-left');
const panelR = createPanel('canvas-right');

function resizeAll() {
  for (const p of [panelL, panelR]) {
    const container = p.canvas.parentElement;
    const w = container.clientWidth;
    const h = container.clientHeight;
    p.renderer.setSize(w, h);
    p.camera.aspect = w / h;
    p.camera.updateProjectionMatrix();
  }
}
window.addEventListener('resize', resizeAll);

// ── Sync cameras ──
function syncFrom(src, dst) {
  if (syncing) return;
  syncing = true;
  dst.camera.position.copy(src.camera.position);
  dst.camera.up.copy(src.camera.up);
  dst.camera.quaternion.copy(src.camera.quaternion);
  dst.controls.target.copy(src.controls.target);
  dst.controls.update();
  syncing = false;
}

// Listen for control changes on both panels
panelL.controls.addEventListener('change', () => syncFrom(panelL, panelR));
panelR.controls.addEventListener('change', () => syncFrom(panelR, panelL));

function animate() {
  requestAnimationFrame(animate);
  panelL.controls.update();
  panelR.controls.update();
  panelL.renderer.render(panelL.scene, panelL.camera);
  panelR.renderer.render(panelR.scene, panelR.camera);
}
animate();

// ── Camera pose ──
function applyCameraPose(pose_c2w) {
  if (!pose_c2w) return;
  const px = pose_c2w[0][3], py = pose_c2w[1][3], pz = pose_c2w[2][3];
  const fwdX = pose_c2w[0][2], fwdY = pose_c2w[1][2], fwdZ = pose_c2w[2][2];
  const upX = -pose_c2w[0][1], upY = -pose_c2w[1][1], upZ = -pose_c2w[2][1];
  const d = sceneRadius * 0.5;

  for (const p of [panelL, panelR]) {
    p.camera.position.set(px, py, pz);
    p.camera.up.set(upX, upY, upZ);
    p.controls.target.set(px + fwdX * d, py + fwdY * d, pz + fwdZ * d);
    p.controls.update();
  }
}

// ── UI ──
const videoSelect = document.getElementById('video-select');
const actionLabel = document.getElementById('action-label');
const timeSlider = document.getElementById('time-slider');
const frameLabel = document.getElementById('frame-label');
const playBtn = document.getElementById('play-btn');
const pointSizeSlider = document.getElementById('point-size-slider');
const loadingIndicator = document.getElementById('loading-indicator');
const followCamCb = document.getElementById('follow-cam-cb');

followCamCb.addEventListener('change', () => {
  followCamera = followCamCb.checked;
  if (followCamera && currentVideo) {
    const frame = currentVideo.frames[currentFrameIdx];
    if (frame && frame.pose_c2w) applyCameraPose(frame.pose_c2w);
  }
});

// ── Load manifest ──
async function init() {
  const resp = await fetch('/api/manifest');
  manifest = await resp.json();

  const videoIds = Object.keys(manifest);
  if (videoIds.length === 0) {
    actionLabel.textContent = 'No results found.';
    return;
  }

  videoSelect.innerHTML = '';
  for (const vid of videoIds) {
    const opt = document.createElement('option');
    opt.value = vid;
    opt.textContent = `${vid} — ${manifest[vid].action_text}`;
    videoSelect.appendChild(opt);
  }

  videoSelect.addEventListener('change', () => selectVideo(videoSelect.value));
  selectVideo(videoIds[0]);
  resizeAll();
}

function selectVideo(videoId) {
  stopPlayback();
  currentVideo = manifest[videoId];
  currentVideo._sceneComputed = false;
  currentFrameIdx = 0;

  actionLabel.textContent = currentVideo.action_text;
  timeSlider.max = currentVideo.num_frames - 1;
  timeSlider.value = 0;
  loadFrame(0);
}

async function loadFrame(idx) {
  if (!currentVideo || idx >= currentVideo.num_frames) return;
  currentFrameIdx = idx;
  timeSlider.value = idx;
  frameLabel.textContent = `${idx + 1} / ${currentVideo.num_frames}`;

  const frame = currentVideo.frames[idx];
  const videoId = currentVideo.video_id;

  loadingIndicator.style.display = 'inline';

  // Load both PLYs in parallel
  const [geomL, geomR] = await Promise.all([
    loadPLYCached(`${videoId}/${frame.basename}_original`, `/data/${videoId}/${frame.basename}_original.ply`),
    loadPLYCached(`${videoId}/${frame.basename}_corrected`, `/data/${videoId}/${frame.basename}_corrected.ply`),
  ]);

  // Only show if still on same frame
  if (currentFrameIdx === idx) {
    showPointCloud(panelL, geomL, frame);
    showPointCloud(panelR, geomR, frame);
  }

  loadingIndicator.style.display = 'none';
}

async function loadPLYCached(cacheKey, url) {
  if (plyCache.has(cacheKey)) return plyCache.get(cacheKey);
  const geometry = await new Promise((resolve, reject) => {
    plyLoader.load(url, resolve, undefined, reject);
  });
  plyCache.set(cacheKey, geometry);
  return geometry;
}

function showPointCloud(panel, geometry, frame) {
  if (panel.pointCloud) {
    panel.scene.remove(panel.pointCloud);
  }

  const material = new THREE.PointsMaterial({
    size: pointSize * 0.01,
    vertexColors: true,
    sizeAttenuation: true,
  });

  panel.pointCloud = new THREE.Points(geometry, material);
  panel.scene.add(panel.pointCloud);

  if (!currentVideo._sceneComputed) {
    geometry.computeBoundingSphere();
    sceneRadius = geometry.boundingSphere.radius;
    currentVideo._sceneComputed = true;
  }

  if (followCamera && frame && frame.pose_c2w) {
    applyCameraPose(frame.pose_c2w);
  } else if (!currentVideo._fallbackCentered) {
    geometry.computeBoundingSphere();
    const center = geometry.boundingSphere.center;
    const radius = geometry.boundingSphere.radius;
    for (const p of [panelL, panelR]) {
      p.controls.target.copy(center);
      p.camera.position.set(center.x, center.y, center.z + radius * 2.5);
      p.controls.update();
    }
    currentVideo._fallbackCentered = true;
  }
}

// ── Playback ──
timeSlider.addEventListener('input', () => loadFrame(parseInt(timeSlider.value)));
playBtn.addEventListener('click', () => { if (playing) stopPlayback(); else startPlayback(); });

function startPlayback() {
  playing = true;
  playBtn.innerHTML = '&#9646;&#9646;';
  playInterval = setInterval(() => {
    let next = currentFrameIdx + 1;
    if (next >= currentVideo.num_frames) next = 0;
    loadFrame(next);
  }, 200);
}

function stopPlayback() {
  playing = false;
  playBtn.innerHTML = '&#9654;';
  if (playInterval) { clearInterval(playInterval); playInterval = null; }
}

pointSizeSlider.addEventListener('input', () => {
  pointSize = parseFloat(pointSizeSlider.value);
  for (const p of [panelL, panelR]) {
    if (p.pointCloud) p.pointCloud.material.size = pointSize * 0.01;
  }
});

// ── Keyboard shortcuts ──
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

  if (e.key === 'ArrowRight' || e.key === 'd') {
    stopPlayback();
    loadFrame(Math.min(currentFrameIdx + 1, currentVideo.num_frames - 1));
  } else if (e.key === 'ArrowLeft' || e.key === 'a') {
    stopPlayback();
    loadFrame(Math.max(currentFrameIdx - 1, 0));
  } else if (e.key === ' ') {
    e.preventDefault();
    if (playing) stopPlayback(); else startPlayback();
  } else if (e.key === 'Home') {
    stopPlayback(); loadFrame(0);
  } else if (e.key === 'End') {
    stopPlayback(); loadFrame(currentVideo.num_frames - 1);
  } else if (e.key === 'c') {
    followCamCb.checked = !followCamCb.checked;
    followCamera = followCamCb.checked;
    if (followCamera && currentVideo) {
      const frame = currentVideo.frames[currentFrameIdx];
      if (frame && frame.pose_c2w) applyCameraPose(frame.pose_c2w);
    }
  }
});

init();
</script>
</body>
</html>
